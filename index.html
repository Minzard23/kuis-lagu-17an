<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuis Lagu Estafet - 17 Agustusan Disdik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon: #7A1128;
    --maroon-dark: #4E0A1A;
    --cream: #FBF2DD;
    --parchment: #F4E7C7;
    --gold: #C9A227;
    --gold-light: #E8C766;
    --ink: #2A1608;
    --ink-soft: #6B5236;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%, rgba(201,162,39,0.10), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(201,162,39,0.10), transparent 45%),
      var(--maroon-dark);
    font-family:'Inter', sans-serif;
    color: var(--ink);
    padding: 48px 20px 80px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .eyebrow{
    font-family:'Inter', sans-serif;
    font-weight:600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-size: 12px;
    color: var(--gold-light);
    margin-bottom: 10px;
    text-align:center;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight: 800;
    font-size: clamp(28px, 5vw, 46px);
    color: var(--cream);
    margin: 0 0 6px;
    text-align:center;
    letter-spacing: -0.01em;
  }
  .subtitle{
    color: rgba(251,242,221,0.75);
    font-size: 15px;
    text-align:center;
    margin: 0 0 36px;
  }
  .board{
    background: var(--cream);
    border: 3px solid var(--gold);
    border-radius: 20px;
    padding: 32px;
    width: 100%;
    max-width: 720px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.35);
  }
  .grid{
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
  }
  @media (max-width: 560px){
    .grid{ grid-template-columns: repeat(3, 1fr); }
    .board{ padding: 22px; }
  }
  .tile{
    aspect-ratio: 1;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    background: linear-gradient(160deg, var(--maroon) 0%, var(--maroon-dark) 100%);
    color: var(--cream);
    font-family:'Fraunces', serif;
    font-weight: 700;
    font-size: 30px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: 0 4px 0 var(--maroon-dark), 0 8px 16px rgba(0,0,0,0.25);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    position: relative;
  }
  .tile:hover:not(.used){
    transform: translateY(-3px);
    box-shadow: 0 7px 0 var(--maroon-dark), 0 12px 20px rgba(0,0,0,0.3);
  }
  .tile:active:not(.used){
    transform: translateY(1px);
    box-shadow: 0 2px 0 var(--maroon-dark), 0 4px 8px rgba(0,0,0,0.25);
  }
  .tile.used{
    cursor: pointer;
    background: var(--parchment);
    color: var(--ink-soft);
    box-shadow: inset 0 0 0 2px rgba(201,162,39,0.4);
    opacity: 0.65;
  }
  .tile.used::after{
    content: '✓';
    position:absolute;
    top:6px;
    right:9px;
    font-size:13px;
    font-family:'Inter', sans-serif;
    color: var(--gold);
  }
  .footer-row{
    display:flex;
    justify-content: space-between;
    align-items:center;
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px dashed rgba(122,17,40,0.25);
  }
  .progress{
    font-size: 13px;
    color: var(--ink-soft);
  }
  .progress b{ color: var(--maroon); }
  .reset-btn{
    font-family:'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--maroon);
    background: none;
    border: 1.5px solid var(--maroon);
    border-radius: 999px;
    padding: 7px 16px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .reset-btn:hover{
    background: var(--maroon);
    color: var(--cream);
  }
  .player-panel{
    width: 100%;
    max-width: 720px;
    margin-top: 20px;
    background: var(--cream);
    border: 3px solid var(--gold);
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.35);
    display: none;
  }
  .player-panel.open{ display: block; }
  .player-top{
    display:flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 20px;
  }
  .player-number{
    font-family:'Fraunces', serif;
    font-weight: 800;
    font-size: 13px;
    color: var(--gold);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin: 0 0 4px;
  }
  .player-title{
    font-family:'Fraunces', serif;
    font-weight: 700;
    font-size: 26px;
    color: var(--maroon);
    margin: 0 0 2px;
    line-height:1.2;
  }
  .player-artist{
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0;
  }
  .player-close{
    background:none;
    border:none;
    color: var(--ink-soft);
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    padding: 4px;
  }
  .video-wrap{
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    border-radius: 12px;
    overflow: hidden;
    background: var(--parchment);
  }
  .video-wrap iframe{
    position: absolute;
    top:0; left:0;
    width: 100%;
    height: 100%;
    border: 0;
  }
  .play-cover{
    position: absolute;
    top:0; left:0;
    width: 100%;
    height: 100%;
    background: var(--parchment);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor: pointer;
  }
  .play-cover-btn{
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: var(--maroon);
    color: var(--cream);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 28px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .play-cover:hover .play-cover-btn{
    transform: scale(1.06);
    background: var(--maroon-dark);
  }
</style>
</head>
<body>

<div class="eyebrow">Dinas Pendidikan Kabupaten Bandung</div>
<h1>Kuis lagu estafet 17 Agustusan</h1>
<p class="subtitle">Pilih satu nomor, lalu tekan play buat muter video karaoke-nya</p>

<div class="board">
  <div class="grid" id="grid"></div>
  <div class="footer-row">
    <div class="progress"><b id="playedCount">0</b> / 10 lagu sudah dibuka</div>
    <button class="reset-btn" id="resetBtn">Reset semua</button>
  </div>
</div>

<div class="player-panel" id="playerPanel">
  <div class="player-top">
    <div>
      <p class="player-number" id="playerNumber">Nomor 1</p>
      <p class="player-title" id="playerTitle">Judul lagu</p>
      <p class="player-artist" id="playerArtist">Artis</p>
    </div>
    <button class="player-close" id="playerClose" aria-label="Tutup">&times;</button>
  </div>
  <div class="video-wrap">
    <div class="play-cover" id="playCover">
      <div class="play-cover-btn">&#9658;</div>
    </div>
    <iframe id="ytFrame" src="" title="Video karaoke" allow="autoplay; encrypted-media" allowfullscreen style="display:none;"></iframe>
  </div>
</div>

<script>
  var songs = [
    { title: "Kopi Dangdut", artist: "Fahmi Shahab", yt: "https://www.youtube.com/watch?v=nN36Q-avzMk&list=RDnN36Q-avzMk&start_radio=1" },
    { title: "Seperti Mati Lampu", artist: "King Nassar", yt: "https://www.youtube.com/watch?v=iKdLkb4Md9w&list=RDiKdLkb4Md9w&start_radio=1" },
    { title: "Surat Cinta", artist: "Vina Panduwinata", yt: "https://www.youtube.com/watch?v=5rQQQVe3M98&list=RD5rQQQVe3M98&start_radio=1" },
    { title: "Bendera", artist: "Coklat", yt: "https://www.youtube.com/watch?v=JoU5RtViDPE&list=RDJoU5RtViDPE&start_radio=1" },
    { title: "Kebyar-Kebyar", artist: "Coklat", yt: "https://www.youtube.com/watch?v=4kiwdB84ewg&list=RD4kiwdB84ewg&start_radio=1" },
    { title: "Anak Sekolah", artist: "Chrisye", yt: "https://www.youtube.com/watch?v=NeauPF1zBj4&list=RDNeauPF1zBj4&start_radio=1" },
    { title: "Rumah Kita", artist: "Godbless", yt: "https://www.youtube.com/watch?v=hRbQUa9e8tM&list=RDhRbQUa9e8tM&start_radio=1" },
    { title: "Laskar Pelangi", artist: "Nidji", yt: "https://www.youtube.com/watch?v=iP3Nd__w0HE&list=RDiP3Nd__w0HE&start_radio=1" },
    { title: "Rungkad", artist: "Happy Asmara", yt: "https://www.youtube.com/watch?v=MVOhue-Vrxo&list=RDMVOhue-Vrxo&start_radio=1" },
    { title: "Bento", artist: "Iwan Fals", yt: "https://www.youtube.com/watch?v=zlxT49ueIXI&list=RDzlxT49ueIXI&start_radio=1" }
  ];

  function extractVideoId(input){
    input = input.trim();
    var watchMatch = input.match(/[?&]v=([^&]+)/);
    if(watchMatch) return watchMatch[1];
    var shortMatch = input.match(/youtu\.be\/([^?&]+)/);
    if(shortMatch) return shortMatch[1];
    var embedMatch = input.match(/embed\/([^?&]+)/);
    if(embedMatch) return embedMatch[1];
    return input;
  }

  var grid = document.getElementById('grid');
  var playerPanel = document.getElementById('playerPanel');
  var playerNumber = document.getElementById('playerNumber');
  var playerTitle = document.getElementById('playerTitle');
  var playerArtist = document.getElementById('playerArtist');
  var playerClose = document.getElementById('playerClose');
  var resetBtn = document.getElementById('resetBtn');
  var playedCountEl = document.getElementById('playedCount');
  var ytFrame = document.getElementById('ytFrame');
  var playCover = document.getElementById('playCover');

  var usedTiles = {};
  var currentSong = null;

  function updateProgress(){
    playedCountEl.textContent = Object.keys(usedTiles).length;
  }

  function openSong(index){
    var song = songs[index];
    currentSong = song;
    playerNumber.textContent = 'Nomor ' + (index + 1);
    playerTitle.textContent = song.title;
    playerArtist.textContent = song.artist;

    ytFrame.src = '';
    ytFrame.style.display = 'none';
    playCover.style.display = 'flex';

    playerPanel.classList.add('open');
    playerPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    if(!usedTiles[index]){
      usedTiles[index] = true;
      grid.children[index].classList.add('used');
      updateProgress();
    }
  }

  for(var i = 0; i < 10; i++){
    (function(idx){
      var btn = document.createElement('button');
      btn.className = 'tile';
      btn.textContent = idx + 1;
      btn.addEventListener('click', function(){ openSong(idx); });
      grid.appendChild(btn);
    })(i);
  }

  playCover.addEventListener('click', function(){
    if(!currentSong) return;
    var videoId = extractVideoId(currentSong.yt);
    ytFrame.src = 'https://www.youtube.com/embed/' + videoId + '?autoplay=1&rel=0&modestbranding=1';
    ytFrame.style.display = 'block';
    playCover.style.display = 'none';
  });

  playerClose.addEventListener('click', function(){
    ytFrame.src = '';
    ytFrame.style.display = 'none';
    playCover.style.display = 'flex';
    playerPanel.classList.remove('open');
  });

  resetBtn.addEventListener('click', function(){
    usedTiles = {};
    var tiles = grid.querySelectorAll('.tile');
    for(var j = 0; j < tiles.length; j++){ tiles[j].classList.remove('used'); }
    updateProgress();
    ytFrame.src = '';
    ytFrame.style.display = 'none';
    playCover.style.display = 'flex';
    playerPanel.classList.remove('open');
  });
</script>

</body>
</html>
